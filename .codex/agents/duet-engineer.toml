## GPUI Kit Patterns

### Bootstrap and Root

Pattern (see `crates/duet/src/main.rs`): `gpui_kit::application().with_assets(gpui_kit::assets::Assets).run(|app| { gpui_kit::init(app); app.spawn(async move |cx| open_main_window(cx)).detach(); })`. `gpui_kit::init` runs FIRST, before any component. The first-level view of every window is `Root::new(view, window, cx)`; overlays (`open_dialog`, `open_sheet`, `push_notification` via `WindowExt`) need it as their host. One window today; a second window is an architectural decision the Orchestrator adjudicates.

### Entities, Render, and state ownership

- A retained view is an `Entity<T>` created with `cx.new(|cx| T::new(...))`. It implements `Render`; `render(&mut self, window: &mut Window, cx: &mut Context<'_, Self>) -> impl IntoElement` builds the tree from `self` and returns it. Spell the lifetime: `Context<'_, Self>` (`elided_lifetimes_in_paths` is an error).
- A value-like element is `RenderOnce`. Choose the unit with the Coding Guides "Choose the right unit" section; do not retain state in a `RenderOnce`.
- State lives in ONE owner. A stateful component (`Input`, `Select`, `Tabs`) is an `Entity<State>` held by the view and passed by reference in `render` (`Input::new(&self.input)`). Never rebuild a state entity inside `render`; that is a feedback loop and a leak.
- Mutation goes through `cx.listener(|view, event, window, cx| { ...; cx.notify(); })`. Name the closure parameters for what they hold (`view`, `_click`, `_win`, `view_cx`); `shadow_unrelated` denies reusing an outer `cx` or `_window` name.
- Cross-entity communication is `cx.emit(Event)` plus `cx.subscribe`/`cx.observe` in the owner. Store the returned `Subscription` in the owner (`_subscriptions: Vec<Subscription>`); a dropped subscription is a silent disconnect and a reviewer flags it.

### Stable identity

Every repeated element needs a domain-derived `ElementId` (`Button::new(("row", record.id))`), never a list index. Index ids reshuffle state on reorder.

### Actions, keybindings, focus

Define actions with `gpui_kit::actions!(duet, [Name])` in the module that handles them; bind with `cx.bind_keys` in bootstrap; handle with `.on_action(cx.listener(...))` on an element that owns a `FocusHandle` and a `key_context`. Focus is explicit: the view holds the `FocusHandle`, `track_focus` marks the element. Read `references/gpui/action.md` and `focus-handle.md` in the `gpui-kit` skill before adding either.

### Theme and layout

Colors come from `cx.theme()` (`.background`, `.foreground`, `.primary`, `.border`, `.muted`); a literal `rgb(...)`/`hsla(...)` in `crates/duet` is a defect. Layout is `v_flex()`/`h_flex()` from `gpui_kit::component` plus `StyledExt` from `gpui_kit::base` (`.gap_4()`, `.font_semibold()`, `.size_full()`). Sizes are `.xsmall()`/`.small()`/`.medium()`/`.large()`. Import traits anonymously (`use gpui_kit::base::StyledExt as _;`); `wildcard_imports` denies glob imports except `gpui_kit::prelude::*`.

### Async and side effects

I/O, timers, and anything that can block run in `cx.spawn(async move |cx| ...)` (foreground, has `AsyncApp`) or `cx.background_spawn` (CPU work, no UI access). Update UI state from the task through `cx.update(|app| ...)` or `entity.update(cx, ...)`. Never block in `render`; never allocate a `Vec`/`String` per frame that a field could hold. A `Task` you do not store is `.detach()`ed on purpose and the reason is in the doc comment of the surrounding fn.

### Never invent an API

Search the current gpui-kit source (`~/.cargo/registry/src/*/gpui-*`) for the real signature before you call it. The most common failure in this codebase is a plausible method that does not exist (`font_semibold` lives on `StyledExt`, not `Div`; `cx.new` needs `AppContext` in scope). The compiler is the oracle; the `gpui-kit` skill's Quick Reference is the map.

## Lint Policy (CRITICAL — the gate is `-D warnings` on everything)

The policy lives in the root `Cargo.toml` `[workspace.lints]`, `clippy.toml`, and `.cargo/config.toml`. Read them; do not memorize a copy. Every crate has `[lints] workspace = true`. Summary of what bites most:

- **No panics in committed code**: `unwrap_used`, `expect_used`, `unwrap_in_result`, `panic`, `panic_in_result_fn`, `todo`, `unimplemented`, `unreachable`, `indexing_slicing`, `string_slice`, `integer_division`, `as_conversions` are all denied. Use `?`, `let Some(x) = ... else { return Err(...) }`, `.get()`, `char::from_digit`, `u32::try_from`, `div_ceil`, `saturating_add`. Tests are exempt for unwrap/expect/panic/index/print (`clippy.toml` `allow-*-in-tests`); `dbg!` is banned everywhere.
- **Output discipline**: `print_stdout`, `print_stderr`, `dbg_macro`, `exit` are denied and `std::process::exit`, `std::dbg`, `std::todo`, `std::unimplemented`, `std::mem::forget`, `std::env::set_var`, `std::env::remove_var` are disallowed in `clippy.toml`. A binary's `main` returns `std::process::ExitCode`; output goes through `writeln!(io::stdout().lock(), ...)` and the `io::Error` propagates. See `tools/plan-db/src/main.rs` `emit` and `main`.
- **Docs on everything**: `missing_docs` (rustc) and `missing_docs_in_private_items` (clippy) are denied, so every module, struct, field, enum variant, fn, and const carries `///` or `//!`. Public fns that return `Result` carry a `# Errors` section and public fns that can panic carry `# Panics` (`check-private-items = false` limits the section ceremony to public API). `rustdoc::all` is denied: every intra-doc link must resolve, every backtick must close.
- **Suppression**: `allow_attributes` and `allow_attributes_without_reason` are denied. The ONLY accepted suppression is a single-site `#[expect(lint, reason = "...")]`. `#[expect]` fails the build when the lint stops firing, so a stale suppression cannot rot. A crate-level `#![allow]`, an edit to `[workspace.lints]`, `clippy.toml`, or `deny.toml`'s `ignore` list to make the gate pass is a defect and an escalation.
- **Unsafe**: `unsafe_code = "deny"` at the workspace, `#![forbid(unsafe_code)]` in `crates/duet` and `tools/xtask`. The one sanctioned site is `tools/plan-db/src/main.rs` `open_lmdb`: `#[expect(unsafe_code, reason = "...")]` on the fn plus a `// SAFETY:` comment on the block (`undocumented_unsafe_blocks`, `multiple_unsafe_ops_per_block` are denied). A second unsafe site is an architectural decision, not an implementation detail.
- **Structure**: `mod_module_files` (no `mod.rs`), `tests_outside_test_module`, `wildcard_enum_match_arm` (name every variant; no `_ =>` on an enum), `rest_pat_in_fully_bound_structs`, `shadow_unrelated`, `let_underscore_must_use`, `let_underscore_untyped`, `str_to_string` (`.to_owned()`, not `.to_string()` on `&str`), `unreachable_pub` (in a binary every cross-module item is `pub(crate)`), `redundant_type_annotations`, `semicolon_if_nothing_returned`.
- **Complexity ceilings** (`clippy.toml`): cognitive complexity 20, 6 arguments, 120 lines, nesting 4. Over the ceiling means extract a struct or a fn, not `#[expect]`.
- **Pedantic that surprises**: `module_name_repetitions` is allowed; `redundant_pub_crate` and `multiple_crate_versions` are allowed (documented conflicts); everything else in `pedantic` and `nursery` is an error, including `needless_pass_by_ref_mut`, `too_long_first_doc_paragraph`, `missing_errors_doc`, `missing_panics_doc`, `default_trait_access`, `wildcard_imports`.

Iterate with `cargo clippy --workspace --all-targets --locked -- -D warnings` (alias `cargo lint`). Read every finding; fix the code.

## Error Handling (CRITICAL)

- **Libraries and tools**: one `#[derive(Debug, thiserror::Error)] enum Error` per crate (or per module boundary) with a `#[error("...")]` message per variant and `#[from]` for wrapped sources. Variants carry the data the message needs as named fields with a doc comment each. See `tools/plan-db/src/main.rs` `Error`.
- **`anyhow`**: only in `tools/xtask`, whose failures are reported to a human and never matched on. Do not add `anyhow` to `crates/duet` or `tools/plan-db`.
- **Propagate with `?`**; convert at the boundary (`main`) into an exit code and one stderr line. Never `map_err(|_| ...)` that drops the source (`map_err_ignore` is denied).
- **Never swallow**: an `if let Err(e) = ... {}` with an empty body, `.ok()` to discard a `Result`, or `let _ = fallible()` is denied or is a defect. Log it with `tracing::error!(%error, "...")` and act, or propagate it.
- **UI boundary**: in `crates/duet` a fallible operation that reaches `render` has already been resolved into view state (`Result` stored on the view, rendered as an error surface). `render` itself is infallible.

## Testing

- **Unit tests** live in `#[cfg(test)] mod tests` in the same file, importing the items under test by name (`use super::click_label;`). See `crates/duet/src/app.rs`.
- **Integration tests** live in `<crate>/tests/<name>.rs`, wrapped in `#[cfg(test)] mod tests { ... }` (`tests_outside_test_module` demands it). Drive a binary through `env!("CARGO_BIN_EXE_<name>")` and `std::process::Command`; never touch the developer's real state (`PLAN_DB_ROOT`, `GIT_CEILING_DIRECTORIES`, a scratch dir under `std::env::temp_dir()` that the test removes). See `tools/plan-db/tests/roundtrip.rs`.
- **UI integration tests** render the production view in a headless window with `#[gpui_kit::test]` (`gpui-kit` feature `test-support`, dev-dependency only), dispatch pointer and keyboard events through `gpui_kit::test`, and assert view state, focus, and owner callbacks. Read `references/gpui/test.md` in the `gpui-kit` skill first.
- **Every assertion has a message** (`missing_assert_message`): `assert_eq!(a, b, "what this proves")`.
- **Tests are the comment channel**: an edge case, an ordering constraint, or a rejected input is a test that goes red when the behaviour breaks, not a `//` line.
- **Doctests** run (`cargo test --doc`); a fenced Rust block in a doc comment compiles and runs unless it is marked `no_run` or `ignore` with a reason in the surrounding prose. `private_doc_tests` is denied.
- Use the `test-author` skill for the file layout and the SUT pattern.

## Dependency Policy

- Every third-party crate is pinned in the root `[workspace.dependencies]` with an exact minimum version and referenced by the crate as `{ workspace = true }`. A crate-local version string is a defect.
- `cargo deny check` must pass: crates.io only (no git, no alternative registries), no wildcard versions, licenses from the allow-list in `deny.toml`, no yanked versions, no open RUSTSEC advisory. A new license or a new advisory ignore is an escalation with a one-line justification and a removal condition, decided by the Orchestrator, never added in an implementation PR.
- `cargo machete` must pass: remove a dependency you stopped using in the same commit.
- Prefer `default-features = false` and name the features you use (`heed` is the example). `openssl-sys` is banned; use rustls.
- `Cargo.lock` is committed and every gate runs `--locked`. Run `cargo update -p <crate>` deliberately, in its own commit.

## Adding a Crate

1. `crates/<name>` for a product crate, `tools/<name>` for automation. The workspace globs both.
2. `Cargo.toml`: `name`, `description`, then `version.workspace = true`, `edition.workspace = true`, `rust-version.workspace = true`, `license.workspace = true`, `repository.workspace = true`, `authors.workspace = true`, `publish.workspace = true`, and `[lints] workspace = true`. The `cargo` clippy group demands the metadata.
3. Root file starts with `//!` crate docs and `#![forbid(unsafe_code)]` unless the crate is the one that owns an unsafe binding.
4. A binary registers nothing else: `scripts/dod.sh` runs `--workspace`. Add the crate to `default-members` in the root `Cargo.toml` only through the Orchestrator.

