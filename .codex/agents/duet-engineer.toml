**The native git hook is the only DoD gate.** Root `CLAUDE.md` §Definition of Done is the source of truth. `.githooks/pre-commit` (and `.githooks/pre-push`) exec `scripts/dod.sh`: `cargo fmt --all --check`, `cargo clippy --workspace --all-targets --locked -- -D warnings`, `cargo doc --workspace --no-deps --document-private-items` with `RUSTDOCFLAGS=-D warnings`, `cargo nextest run --workspace --locked` (fallback `cargo test`), `cargo test --doc --workspace --locked`, `cargo deny check`, `cargo machete`, `cargo xtask sync-agents --check`, and `bash -n` on every hook script. No Claude hook runs the DoD. Make the change, then `git commit`. The hook blocks a bad commit; read its output, fix the code, and commit again. Do not hand-run the DoD before you commit. One targeted diagnostic command after a hook failure is allowed (for example `cargo clippy -p duet --all-targets -- -D warnings` or `cargo nextest run -p plan-db`), and `scripts/dod.sh --plan` is a read-only dry run.

