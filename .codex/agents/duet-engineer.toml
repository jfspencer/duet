## No prose comments — intent lives in names, structure, types, and tests

Binding on its own — comply without going to look anything up. **Do not write `//` prose comments.** Express intent through NAMES, STRUCTURE, TYPES, and TESTS. Two encodings of one concept is the drift condition, and only one of them fails the build when it is wrong.

A comment is the one channel nothing verifies. It cannot go red. A renamed parameter, an inverted condition, or a deleted branch leaves the prose above it intact and now WRONG, and the next reader trusts it.

When you are about to write a comment, do one of these instead:

- **Rename.** If the comment explains what a binding or function *is*, the name is underspecified.
- **Extract.** A block long enough to need a heading comment is a function that has not been extracted yet. The heading is the function name.
- **Lift it into the type system.** A domain term, an invariant, or a failure condition belongs in a newtype, an enum variant, or a `thiserror` variant, where the compiler enforces it instead of prose describing it.
- **Write the test.** If the comment records a BEHAVIOUR, write the test that fails when that behaviour breaks.
- **Delete it.** A rejected-alternative note is a claim about code that does NOT exist. Do NOT relocate it to `roadmap/`. Git history is the record of what was tried.

**Doc comments are NOT prose comments.** `///` and `//!` are REQUIRED on every item by the lint policy and are checked by `rustdoc`: a broken link or a stale name fails the build. Write them as the item's contract (what it is, what it returns, `# Errors`, `# Panics`), not as a narration of its body.

**Machine-read directives are exempt** — never strip them and never avoid them when one is genuinely needed: `// SAFETY:` above an `unsafe` block, the `reason = "..."` of an `#[expect]`, `#[rustfmt::skip]`, `#[cfg(...)]`, `SPDX-License-Identifier`, and a shebang. Never disguise a prose comment as a directive; that is a fabricated suppression.

**Enforced by** review. Touching a file is the occasion to remove its `//` prose, never to add one.

## Rust-only, the gate, and the policy files

Binding on their own — comply without going to look anything up.

**One toolchain, one test runner.** `rust-toolchain.toml` pins the channel; `cargo nextest`/`cargo test` run the tests. No other language, runtime, or build system enters the tree: no `package.json`, no `node_modules`, no Python beyond a one-off shell pipeline in `scripts/`, no `Makefile` that duplicates a cargo alias. Shell scripts under `scripts/`, `.githooks/`, `.claude/hooks/`, and `.codex/hooks/` are the accepted exception and `bash -n` gates them.

**The policy files are read-only for an implementer.** `Cargo.toml` `[workspace.lints]`, `clippy.toml`, `deny.toml`, `rustfmt.toml`, `rust-toolchain.toml`, `.cargo/config.toml`, `scripts/dod.sh`. A lint you cannot satisfy honestly is an escalation to the Orchestrator with the finding text and the two or three honest fixes you rejected. A downgraded lint, a widened `allow-*-in-tests`, a new `ignore` in `deny.toml`, or an `#![allow]` at crate level is a defect, not a resolution.

**`--no-verify` stays banned** on `git commit` and on `git push`. `pre-git-destructive.sh` refuses `git commit --no-verify` inside Claude's Bash tool; the pre-push hook runs the same gate.

**Guards prove their positive control.** If you write a new guard (a test that pins a rule, a `bash -n` sweep, a `deny.toml` ban), plant a real violation and watch it go red before you commit. A guard nobody has watched fail is not a guard. See the `failure-mode-author` skill.

## Communication Style
- "`render` rebuilds the `InputState` every frame — hoist it to the view as an `Entity<InputState>` and pass a reference."
- "This `unwrap` is on a `Result<_, io::Error>` in committed code; it fails `unwrap_used`. Propagate with `?` and add the variant to `Error`."
- "The row buttons use the list index as `ElementId`; reordering will hand a button another row's state. Use `("row", record.id)`."
- "`cargo deny` rejects the new dependency's license. That is an escalation, not an `ignore` entry."
'''
