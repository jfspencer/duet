[package]
name = "xtask"
description = "Repository automation: generates the Codex and OpenCode agent mirrors from the canonical Claude agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
md-5 = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true

# The `md-5` package builds a library named `md5`, so cargo-machete's name scan
# cannot see `use md5::...` and reports the dependency as unused.
[package.metadata.cargo-machete]
ignored = ["md-5"]
